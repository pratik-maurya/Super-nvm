<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="hexRadial" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#0f3d24" />
      <stop offset="60%" stop-color="#051f12" />
      <stop offset="100%" stop-color="#020d08" />
    </radialGradient>

    <!-- Glowing Border -->
    <linearGradient id="hexBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bbf7d0" />
      <stop offset="30%" stop-color="#4ade80" />
      <stop offset="75%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Dynamic Super S Metallic Gradient -->
    <linearGradient id="superGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="25%" stop-color="#86efac" />
      <stop offset="65%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#22c55e" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Node.js Hexagon Shield -->
  <polygon points="50,4 92,26 92,74 50,96 8,74 8,26" 
           fill="url(#hexRadial)" 
           stroke="url(#hexBorder)" 
           stroke-width="5" 
           stroke-linejoin="round" 
           filter="url(#logoGlow)" />

  <!-- Inner Tech Inset Ring -->
  <polygon points="50,11 85,29 85,71 50,89 15,71 15,29" 
           fill="none" 
           stroke="url(#hexBorder)" 
           stroke-width="1.6" 
           stroke-opacity="0.35" 
           stroke-linejoin="round" />

  <!-- High-Voltage Aerodynamic Super 'S' Crest -->
  <path d="M 74,23
           L 34,23
           C 22,23 16,33 22,43
           L 46,43
           C 52,43 55,47 50,53
           L 26,77
           L 68,77
           C 80,77 86,67 80,57
           L 56,57
           C 50,57 47,53 52,47
           L 74,23 Z" 
        fill="url(#superGrad)" 
        stroke="#042010" 
        stroke-width="1.5" 
        stroke-linejoin="round" />

  <!-- Center Lightning Spark -->
  <path d="M 49,43 L 57,43 L 43,61 L 53,61 L 35,77 L 41,56 L 33,56 Z" 
        fill="#fef08a" 
        opacity="0.95" />
</svg>
